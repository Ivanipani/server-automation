---
argument_specs:
  main:
    short_description: Install the os-tailscale plugin package on OPNsense.
    description:
      - Raw `pkg install`/`pkg delete` over SSH (FreeBSD has no Python
        until this has run, or ever, really). `install.yml` runs when
        enabled, `uninstall.yml` when not — both idempotent via
        `pkg info -q`.
      - "`uninstall.yml` stops tailscaled via raw rc.d before deleting
        the package — self-contained, doesn't depend on the sibling
        opnsense-tailscale-configure role's API-based deconfigure.yml
        having run (or even existing: the API disappears once the
        package is gone)."
      - "Run over an SSH-connected play with `become: true`. Configuration
        (settings/auth/subnet routes) is the sibling
        opnsense-tailscale-configure role, run separately over
        `connection: local` against the API."
    author:
      - Ivan Perdomo
    options:
      opnsense_tailscale_enabled:
        type: bool
        default: true
        description: False runs uninstall.yml (pkg delete) instead of install.yml.
      opnsense_tailscale_plugin_pkg:
        type: str
        default: os-tailscale
