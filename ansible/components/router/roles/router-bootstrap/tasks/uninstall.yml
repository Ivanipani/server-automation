---
- name: Remove ansible sudoers file
  ansible.builtin.raw: rm -f /usr/local/etc/sudoers.d/ansible
  changed_when: true

- name: Remove ansible user
  ansible.builtin.raw: pw userdel ansible -r
  changed_when: true
  failed_when: false

- name: Remove ansible group
  ansible.builtin.raw: pw groupdel ansible
  changed_when: true
  failed_when: false
