---
# Configure (or cleanly disable) the os-tailscale plugin via its REST
# API. Expects: connection-local play (talks to OPNsense from the
# controller via https + basic auth). Auth credentials come from
# module_defaults in the calling play. Plugin must already be
# installed — see the sibling opnsense-tailscale-install role. Order
# relative to that role doesn't matter: its uninstall.yml stops the
# daemon itself via raw rc.d before removing the package, so it
# doesn't depend on this role's API-based deconfigure having run first.

- import_tasks: configure.yml
  when: opnsense_tailscale_enabled

- import_tasks: deconfigure.yml
  when: not opnsense_tailscale_enabled
