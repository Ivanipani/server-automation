---
# Assert-only smoke test for the os-baseline component. Mutates
# nothing; safe to run any time against a live host.
#
#   ansible-playbook --vault-password-file ../../../secrets/ansible-pass \
#     components/os-baseline/tests/verify.yml

- name: Verify os-baseline
  hosts: "{{ os_baseline_hosts | default('physical') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Check the ansible/tourmanager users exist
      ansible.builtin.command: "id {{ item }}"
      loop:
        - ansible
        - tourmanager
      register: os_baseline_verify_users
      changed_when: false

    - name: root account is password-locked
      ansible.builtin.command: passwd -S root
      register: os_baseline_verify_root
      changed_when: false

    - name: root is locked (L)
      ansible.builtin.assert:
        that:
          - "' L ' in (' ' + os_baseline_verify_root.stdout + ' ')"
        quiet: true

    - name: sshd hardening drop-in is present
      ansible.builtin.stat:
        path: "{{ image_baseline_sshd.drop_in_path }}"
      register: os_baseline_verify_sshd

    - name: sshd hardening drop-in exists and disables password auth
      ansible.builtin.assert:
        that:
          - os_baseline_verify_sshd.stat.exists
        fail_msg: "{{ image_baseline_sshd.drop_in_path }} missing — run `just os-baseline`."
        quiet: true

    - name: ufw is active
      ansible.builtin.command: ufw status
      register: os_baseline_verify_ufw
      changed_when: false

    - name: ufw reports active
      ansible.builtin.assert:
        that:
          - "'Status: active' in os_baseline_verify_ufw.stdout"
        quiet: true

    - name: poochella MOTD script is installed
      ansible.builtin.stat:
        path: /etc/update-motd.d/00-poochella-banner
      register: os_baseline_verify_motd
      when: motd_enabled | default(true)

    - name: MOTD script present when enabled
      ansible.builtin.assert:
        that:
          - os_baseline_verify_motd.stat.exists
        quiet: true
      when: motd_enabled | default(true)
