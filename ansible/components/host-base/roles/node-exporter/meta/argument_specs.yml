---
argument_specs:
  main:
    short_description: Install and run Prometheus node_exporter
    author:
      - Ivan Perdomo
    options:
      node_exporter_enabled:
        type: bool
        default: true
        description: "False stops + disables the service (runs uninstall.yml) instead of installing/starting it."
      node_exporter_version:
        type: str
        default: "1.8.2"
        description: Pinned upstream release version to install.
      node_exporter_arch:
        type: str
        default: amd64
        description: Release tarball architecture suffix.
      node_exporter_url:
        type: str
        description: Release tarball download URL. Derived from version + arch by default.
      node_exporter_install_dir:
        type: str
        default: /opt/node_exporter
        description: Where the release tarball is unpacked.
      node_exporter_bin:
        type: str
        description: Path to the node_exporter binary. Derived from node_exporter_install_dir by default.
      node_exporter_user:
        type: str
        default: node_exporter
        description: System user node_exporter runs as.
      node_exporter_group:
        type: str
        default: node_exporter
        description: System group node_exporter runs as.
      node_exporter_listen_address:
        type: str
        default: ":9100"
        description: Address/port the exporter's HTTP server binds to.
      node_exporter_textfile_dir:
        type: str
        default: /var/lib/node_exporter/textfile_collector
        description: Directory scanned by the textfile collector.
      node_exporter_extra_args:
        type: str
        default: ""
        description: Extra CLI arguments appended to the systemd unit's ExecStart.
