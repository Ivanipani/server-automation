---
# Component: host-base (layer 1) — see component.yml / README.md.
#
# Apply:  just host-base
# Read-only disk report ("just disk-plan"):
#         ansible-playbook ... --tags storage -e host_disks_action=info
#         playbooks/poochella/infra/14-host-base.yml
#
# Critical path: bootstrap (host-base role) must precede ssh-hardening
# — the ansible/pani SSH keys have to be enrolled before password auth
# is turned off. Everything after that is an order-independent day-2
# step that depends only on bootstrap having run.

- name: Detect SSH user for every host-base host
  hosts: "{{ host_base_hosts | default('physical') }}"
  gather_facts: false
  connection: local
  vars:
    fallback_user: root
  roles:
    - role: ssh-bootstrap-detect
      tags: [bootstrap]

- name: Apply baseline (host-base role)
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  remote_user: "{{ bootstrap_user }}"
  vars:
    # First-time bootstrap on fresh PVE hypervisors connects as root
    # with the vault password (the PVE auto-installer answerfile bakes
    # that root password; `host_root_pass` in group_vars/all/vars.yml
    # must match). The role then resets root to the same value via
    # `ansible.builtin.user`, and subsequent runs use the ansible key —
    # ssh-hardening later sets `PermitRootLogin no`, so this fallback
    # path only fires in the install->ssh-hardening window on a fresh
    # PVE box.
    #
    # Debian baremetal workers DO NOT need the root fallback: their
    # preseed (img/debian/) locks root entirely and creates the
    # ansible user with the canonical key, so ssh-bootstrap-detect
    # resolves to `ansible` on the very first probe.
    ansible_password: "{{ host_root_pass if use_root_password | default(false) else omit }}"
  roles:
    - role: host-base
      tags: [bootstrap]

- name: Harden sshd
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: ssh-hardening
      tags: [ssh-hardening]

- name: Configure host firewall
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: firewall-basic
      tags: [firewall]
      vars:
        # Kept as "17-host" (the pre-migration tier name), not renamed
        # to "host-base": firewall-basic's ufw reconciler only deletes
        # rules tagged with the CURRENT scope (see
        # roles/firewall-basic/files/ufw_reconcile.py) — renaming the
        # scope would orphan every already-applied rule on the live
        # fleet under the old tag forever instead of cleanly replacing
        # it. The string is just an ownership label; it doesn't need
        # to match this component's name.
        firewall_basic_scope: 17-host
        inbound_allow: "{{ firewall_inbound_allow | default([]) }}"

- name: Install the poochella MOTD
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: motd
      tags: [motd]

- name: Realise node-local storage
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: host-disks
      tags: [storage]
      when: storage is defined and storage.disks is defined

- name: Mount nas01 NFS shares
  hosts: "{{ host_base_hosts | default('physical') }}"
  gather_facts: false
  become: true
  roles:
    - role: nfs-mounts
      tags: [nfs-mounts]

- name: Disable buggy NIC TX offloads
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: nic-offload
      tags: [nic-offload]
      when: disable_nic_offloads | default(false) | bool

- name: Firmware baseline (fwupd + LVFS)
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: firmware
      tags: [firmware]

- name: Install Tailscale
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: tailscale
      tags: [tailscale]

- name: Install Prometheus node_exporter
  hosts: "{{ host_base_hosts | default('physical') }}"
  become: true
  roles:
    - role: node-exporter
      tags: [node-exporter]
