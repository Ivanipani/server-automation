---
- name: Assert the fetched kubeconfig exists
  ansible.builtin.stat:
    path: "{{ flux_kubeconfig }}"
  register: _kubeconfig_stat
  failed_when: not _kubeconfig_stat.stat.exists
- name: Assert required control-node CLIs are present
  ansible.builtin.command: "which {{ item }}"
  changed_when: false
  check_mode: false
  loop:
    - flux
    - kubectl
  register: _cli_check
  failed_when: _cli_check.rc != 0
- name: Require bootstrap repository and key when enabled
  ansible.builtin.assert:
    that:
      - flux_git_url | length > 0
      - flux_path | length > 0
      - flux_ssh_private_key | trim | length > 0
    quiet: true
  no_log: true
  when: flux_enabled | bool
