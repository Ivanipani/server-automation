---
# Assertions + state load for the synology-storage tasks.
#
# Asserts `synology_storage_vol_path` + `synology_storage_shares` are
# usable (pool/volume are EXPECTED to already exist; the role is
# additive and does not create them) and pre-computes the declared
# shares list annotated with the target vol_path so the downstream
# task files iterate without re-reading these vars.

- name: Assert this host has a usable storage target
  ansible.builtin.assert:
    that:
      - synology_storage_vol_path is match('^/volume[0-9]+$')
    fail_msg: |
      synology_storage_vol_path is unset or malformed (expected e.g.
      /volume1). The deployment layer computes this from inventory's
      `storage.vol_path` — see playbooks/poochella/infra/12-nas.yml.
    quiet: true

- name: Find shares whose description exceeds DSM's 64-char limit
  # DSM's SYNO.Core.Share/create rejects descriptions longer than 64
  # chars with error code 3300, but returns HTTP 200 — easy to mistake
  # for a silent no-op. Surface it here with an actionable message.
  ansible.builtin.set_fact:
    _oversized_share_descriptions: >-
      {{ synology_storage_shares
         | selectattr('description', 'defined')
         | rejectattr('description', 'match', '^.{0,64}$')
         | map(attribute='name') | list }}

- name: Assert every share description fits DSM's 64-char limit
  ansible.builtin.assert:
    that:
      - _oversized_share_descriptions | length == 0
    fail_msg: |
      These shares have a description longer than DSM's 64-char limit
      (SYNO.Core.Share/create would fail with code 3300):
        {{ _oversized_share_descriptions }}
      Shorten the description in inventory.yaml to <= 64 characters.
    quiet: true

- name: Build the declared-shares list (each share annotated with vol_path)
  ansible.builtin.set_fact:
    _declared_shares: >-
      {{ synology_storage_shares
         | map('combine', {'_vol_path': synology_storage_vol_path})
         | list }}

- name: Show what the role will reconcile
  ansible.builtin.debug:
    msg:
      target_vol_path: "{{ synology_storage_vol_path }}"
      declared_shares: "{{ _declared_shares | map(attribute='name') | list }}"
      shares_with_nfs_rules: >-
        {{ _declared_shares
           | selectattr('nfs', 'defined')
           | selectattr('nfs.rules', 'defined')
           | map(attribute='name') | list }}
