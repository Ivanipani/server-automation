---
# Component: host-hardware (layer 2) — see component.yml / README.md.
#
# Apply:  just host-hardware
# Read-only disk report ("just disk-plan"):
#         ansible-playbook ... --tags storage -e host_disks_action=info
#         playbooks/poochella/infra/15-host-hardware.yml
#
# All four plays are order-independent day-2 steps that depend only on
# os-baseline having created the ansible user — see README.md.

- name: Realise node-local storage
  hosts: "{{ host_hardware_hosts | default('physical') }}"
  become: true
  roles:
    - role: host-disks
      tags: [storage]
      when: storage is defined and storage.disks is defined

- name: Mount nas01 NFS shares
  hosts: "{{ host_hardware_hosts | default('physical') }}"
  gather_facts: false
  become: true
  roles:
    - role: nfs-mounts
      tags: [nfs-mounts]

- name: Disable buggy NIC TX offloads
  hosts: "{{ host_hardware_hosts | default('physical') }}"
  become: true
  roles:
    - role: nic-offload
      tags: [nic-offload]
      when: disable_nic_offloads | default(false) | bool

- name: Firmware baseline (fwupd + LVFS)
  hosts: "{{ host_hardware_hosts | default('physical') }}"
  become: true
  roles:
    - role: firmware
      tags: [firmware]
