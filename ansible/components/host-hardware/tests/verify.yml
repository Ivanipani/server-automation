---
# Assert-only smoke test for the host-hardware component. Mutates
# nothing; safe to run any time against a live host.
#
#   ansible-playbook --vault-password-file ../../../secrets/ansible-pass \
#     components/host-hardware/tests/verify.yml

- name: Verify host-hardware
  hosts: "{{ host_hardware_hosts | default('physical') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Every declared NFS mount is a live mountpoint
      ansible.builtin.command: "mountpoint -q {{ item.path }}"
      loop: "{{ nfs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      changed_when: false
      when: nfs_mounts | default([]) | length > 0

    - name: fwupd is installed when firmware_enabled
      ansible.builtin.command: dpkg-query -W -f '${Status}' fwupd
      register: host_hardware_verify_fwupd
      changed_when: false
      failed_when: false
      when: firmware_enabled | default(true)

    - name: fwupd package state matches firmware_enabled
      ansible.builtin.assert:
        that:
          - "'install ok installed' in host_hardware_verify_fwupd.stdout"
        fail_msg: "fwupd not installed — run `just host-hardware`."
        quiet: true
      when: firmware_enabled | default(true)

    - name: NIC offload tuning applied when disable_nic_offloads
      ansible.builtin.stat:
        path: /usr/local/sbin/nic-offload-tune
      register: host_hardware_verify_nic_offload
      when: disable_nic_offloads | default(false) | bool

    - name: NIC offload helper script present
      ansible.builtin.assert:
        that:
          - host_hardware_verify_nic_offload.stat.exists
        quiet: true
      when: disable_nic_offloads | default(false) | bool
