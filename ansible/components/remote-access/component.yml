---
name: remote-access
layer: 2
description: >-
  Tailscale client. Default-off in poochella: the OPNsense subnet
  router already gives off-LAN clients LAN-equivalent reach, so
  per-host Tailscale is opt-in for a node that needs direct
  P2P-encrypted tailnet membership independent of the gateway path.
depends_on: [control-node, os-baseline]
target_default: physical
target_var: remote_access_hosts
