---
# k3s_node_labels, minus the keys the kubelet is forbidden to self-assign.
#
# `node-role.kubernetes.io/*` is what `kubectl get nodes` renders in the ROLES
# column, and it is reserved: kubelet REFUSES TO START when --node-labels
# carries a kubernetes.io key outside its allow-list, so passing one through
# INSTALL_K3S_EXEC would brick a greenfield join. It can only be set by an API
# client, which is exactly what _node_labels.yml is (delegated kubectl on a CP,
# admin kubeconfig, no NodeRestriction). So: role labels are reconcile-only,
# everything else is stamped at registration AND reconciled.
#
# topology.kubernetes.io/zone is NOT filtered — it is on the kubelet allow-list
# and must land at first registration for Longhorn anti-affinity.
k3s_registration_node_labels: >-
  {{ k3s_node_labels | reject('match', 'node-role\.kubernetes\.io/') | list }}
