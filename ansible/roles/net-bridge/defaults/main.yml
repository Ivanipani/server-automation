---
# Enslave a host's primary NIC into a Linux bridge so guests (today: KubeVirt
# VMs via Multus + the bridge CNI) can be first-class LAN peers with their own
# MAC and their own OPNsense dnsmasq reservation.
#
#   true  → converge /etc/network/interfaces onto the bridged layout and, if
#           that changed anything, cut the live host over to it.
#   false → restore the plain (unbridged) DHCP layout on the same NIC and cut
#           back. The role is fully reversible either way; the reverse path
#           runs the SAME cutover machinery, including the rollback timer.
net_bridge_enabled: true

# Bridge topology, per host, from inventory.yaml:
#   network_bridge: { name: br0, port: eno1np0 }
# Hosts that declare no `network_bridge` are skipped entirely (the play's
# `when:`), so this role is a no-op across most of the fleet.
net_bridge: "{{ network_bridge | default({}) }}"

# DEAD-MAN'S SWITCH. Reconfiguring the only NIC of a remote host is the one
# routine change that can take the box off the network permanently — this
# fleet's workers have a single cabled port (the spares have no carrier), so a
# bad bridge means a trip to the machine with a monitor.
#
# Before the cutover the role arms a transient systemd timer that restores the
# pre-bridge config and brings the plain NIC back up. Ansible cancels it only
# after it has re-established SSH. So the failure mode of "bridge comes up but
# the host is unreachable" self-heals in this many seconds instead of needing
# physical access. Must comfortably exceed DHCP + SSH re-establish time.
net_bridge_rollback_seconds: 240

# The MAC the bridge must present. The OPNsense dnsmasq reservation is keyed on
# the primary NIC's MAC, so the bridge has to claim that same address or DHCP
# hands back nothing and the host falls off the LAN. Do NOT rely on the kernel
# adopting the port's MAC — it does so only when the port is enslaved before the
# bridge comes up, and losing that race costs the host its address (observed:
# br0 came up on a random MAC, got no offer, fell back to IPv4LL).
# Overridable per host via `network_bridge: {mac: ...}`; otherwise read live
# from sysfs by the role.
net_bridge_mac: "{{ net_bridge.mac | default(net_bridge_port_mac | default('')) }}"

# Saved copy of the pre-bridge /etc/network/interfaces. Written ONCE (never
# overwritten on later runs, or it would capture the bridged config and make
# the rollback a no-op) and used by both the rollback timer and the
# `net_bridge_enabled: false` reverse path.
net_bridge_backup_path: /etc/network/interfaces.pre-bridge
