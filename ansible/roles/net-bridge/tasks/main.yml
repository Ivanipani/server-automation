---
# Converge /etc/network/interfaces onto (or off) the bridged layout, then cut
# the LIVE host over to it behind a dead-man's switch. See defaults/main.yml.

- name: Assert the bridge topology is fully declared
  ansible.builtin.assert:
    that:
      - (net_bridge.name | default('')) | length > 0
      - (net_bridge.port | default('')) | length > 0
    fail_msg: >-
      net-bridge needs `network_bridge: {name: ..., port: ...}` on
      {{ inventory_hostname }} in inventory.yaml.

- name: Install bridge-utils
  # ifupdown shells out to brctl for `bridge_ports`. Kept installed even on the
  # disabled path so the reverse cutover (which deletes the bridge) still has
  # its tooling.
  ansible.builtin.apt:
    name: bridge-utils
    state: present

- name: Save the pre-bridge network config
  # force:false is load-bearing — a second run must NOT capture the bridged
  # config, or the rollback below would "restore" the very thing it exists to
  # undo.
  ansible.builtin.copy:
    src: /etc/network/interfaces
    dest: "{{ net_bridge_backup_path }}"
    remote_src: true
    force: false
    mode: "0644"

- name: Install the cutover + rollback scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
  loop:
    - net-bridge-cutover.sh
    - net-bridge-rollback.sh

- name: Render the bridged network config
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    mode: "0644"
    # Never leave the host with a half-written interfaces(5) file.
    validate: "test -s %s"
  register: net_bridge_conf
  when: net_bridge_enabled | bool

- name: Check whether a pre-bridge config was ever saved
  ansible.builtin.stat:
    path: "{{ net_bridge_backup_path }}"
  register: net_bridge_backup_stat

- name: Restore the unbridged network config
  ansible.builtin.copy:
    src: "{{ net_bridge_backup_path }}"
    dest: /etc/network/interfaces
    remote_src: true
    mode: "0644"
  register: net_bridge_unconf
  when:
    - not (net_bridge_enabled | bool)
    # Nothing to restore on a host that was never bridged.
    - net_bridge_backup_stat.stat.exists | default(false)

# ── Cutover ──────────────────────────────────────────────────────────────
# Only when the config actually moved. A converged host re-runs as changed=0
# and never touches its own networking.
- name: Cut the host over to the new network layout
  when:
    - (net_bridge_conf is changed) or (net_bridge_unconf is changed)
    - not ansible_check_mode
  block:
    - name: Arm the rollback timer
      # Fires in net_bridge_rollback_seconds unless cancelled below. This is
      # the ONLY thing standing between a bad bridge and a physical console.
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=net-bridge-rollback
          --on-active={{ net_bridge_rollback_seconds }}
          /usr/local/sbin/net-bridge-rollback.sh
      changed_when: true

    - name: Run the cutover detached
      # --no-block + a transient unit: the script survives the SSH connection
      # it is about to kill. A plain `command` (even async) dies with the
      # session's cgroup mid-teardown.
      ansible.builtin.command:
        cmd: >-
          systemd-run --unit=net-bridge-cutover --no-block
          /usr/local/sbin/net-bridge-cutover.sh
      changed_when: true

    - name: Wait for the host to come back on {{ ansible_host }}
      # Same address either way: the bridge adopts its port's MAC, so the
      # OPNsense reservation hands back the identical lease.
      ansible.builtin.wait_for_connection:
        delay: 10
        # Comfortably inside the rollback window — if we are still waiting when
        # the timer fires, the host self-heals and this fails honestly rather
        # than racing the recovery.
        timeout: "{{ (net_bridge_rollback_seconds | int) - 60 }}"

    - name: Read back the live interface state
      ansible.builtin.command:
        cmd: ip -brief addr show {{ net_bridge.name if (net_bridge_enabled | bool) else net_bridge.port }}
      register: net_bridge_live
      changed_when: false

    - name: Assert the expected interface holds the host address
      ansible.builtin.assert:
        that:
          - ansible_host_ip in net_bridge_live.stdout
        fail_msg: >-
          {{ net_bridge.name if (net_bridge_enabled | bool) else net_bridge.port }}
          did not come up with {{ ansible_host_ip }} —
          {{ net_bridge_live.stdout }}. The rollback timer is still armed and
          will restore the previous layout.
      vars:
        ansible_host_ip: "{{ hostvars[inventory_hostname].ip_address }}"

  always:
    - name: Cancel the rollback timer
      # `always` so a failure anywhere above still disarms only AFTER the
      # assert has had its say — a genuinely unreachable host never reaches
      # this task at all, which is the whole point.
      ansible.builtin.systemd:
        name: net-bridge-rollback.timer
        state: stopped
      failed_when: false
      changed_when: false

# ── Forwarding policy ────────────────────────────────────────────────────
# k3s loads br_netfilter with bridge-nf-call-iptables=1, so frames bridged
# between the VM veth and the physical port are evaluated by iptables FORWARD —
# where ufw's DEFAULT_FORWARD_POLICY=DROP ("deny (routed)") silently eats them.
# Without this rule the VM gets a link but no DHCP reply and no traffic at all.
# Tagged with its own comment, so firewall-basic's reconciler (which only
# prunes `firewall-basic[<scope>]` rules) leaves it alone.
- name: Allow bridged guest traffic through ufw
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ net_bridge.name }}"
    interface_out: "{{ net_bridge.name }}"
    comment: "net-bridge: bridged guest traffic on {{ net_bridge.name }}"
    delete: "{{ not (net_bridge_enabled | bool) }}"
