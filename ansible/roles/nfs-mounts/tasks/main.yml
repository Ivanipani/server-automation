---
# Mount nas01 NFS shares onto this host. What gets mounted is declared
# in `nfs_mounts` — hosts with no definition mount nothing.
#
# Mount options chosen for resilience (per-mount, declared by the
# caller):
#   vers=4          NFSv4 (matches the NAS's enabled protocol set by
#                   the nas component's synology_dsm_nfs_enable_v4)
#   _netdev         Mount only after networking is up
#   nofail          A NAS outage at boot does NOT block host boot —
#                   the host comes up, the mount fails, you debug
#   bg              Background mount-retries after initial failure
#   soft,timeo=30   Fail cleanly after ~3s of retries instead of
#                   hanging the calling process forever
#
# Pre-conditions:
#   - nas01 is reachable on the LAN
#   - The shares listed in `nfs_mounts` exist with the right NFS
#     export rules (see components/nas/roles/synology-storage)
#
# Re-run safely: ansible.posix.mount is idempotent on /etc/fstab and
# on the live mount; running this when everything is already correct
# is a no-op.

- name: Assert nfs_mounts_server is set when mounts are declared
  ansible.builtin.assert:
    that:
      - nfs_mounts_server | length > 0
    fail_msg: "nfs_mounts_server must be set (the caller resolves hostvars['nas01'].ansible_host) whenever nfs_mounts is non-empty."
  when: nfs_mounts | length > 0

# Transitional: bootserv01 LXC now serves PXE over HTTP so the NAS
# `pxe` share is no longer mounted anywhere. ansible.posix.mount with
# `state: mounted` does NOT auto-remove stragglers from a prior config,
# so do it explicitly here. Idempotent + safe on hosts that never had
# it (state: absent is a no-op when neither the mount nor the fstab
# entry exists). Drop this task in a follow-up after one full apply
# across the fleet confirms it's gone everywhere.
- name: Unmount + drop fstab entry for /mnt/nas/pxe (obsolete)
  ansible.posix.mount:
    path: /mnt/nas/pxe
    state: absent

- name: Install NFS client utilities (mount.nfs lives in nfs-common)
  ansible.builtin.apt:
    name: nfs-common
    state: present
  when: nfs_mounts | length > 0

# Create the mountpoint via mkdir -p + a `creates:` guard, NOT via
# `ansible.builtin.file: state=directory`. Reason: once the NFS share
# is mounted, the file module's owner/mode enforcement hits EROFS on
# subsequent runs because it tries to chmod/chown the now-NFS-backed
# directory. mkdir -p with `creates:` simply skips when the path
# exists, so idempotence survives the mount.
- name: Ensure NFS mount point directories exist
  ansible.builtin.command:
    cmd: "mkdir -p {{ item.path | quote }}"
    creates: "{{ item.path }}"
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount each declared NFS share (idempotent fstab + mount)
  ansible.posix.mount:
    src: "{{ nfs_mounts_server }}:/volume1/{{ item.share }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: "{{ item.options }}"
    state: mounted
  loop: "{{ nfs_mounts }}"
  loop_control:
    label: "{{ item.share }} -> {{ item.path }}"

# NOTE: client-side `chmod` does NOT grant access on Synology shares.
# DSM enforces a proprietary "Synology ACL" layer that overrides POSIX
# mode; chmod from an NFS client briefly sets the dirent mode but DSM
# periodically resyncs the mode to match the Synology ACL (which
# defaults to admin-only on share create). Share access must be
# granted on the NAS side — either via DSM UI (Control Panel -> Shared
# Folder -> Edit -> Permissions) or via `synoacltool` over SSH.
# Automation candidate: SYNO.Core.Share.Permission API (not wired into
# the synology-storage role yet).
