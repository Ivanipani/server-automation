---
# Reversible entry point (see CLAUDE.md's Ansible guidelines). Defaults
# to enabled to preserve the role's historical always-on behavior; every
# current caller sets bootserv_enabled explicitly (see inventory.yaml's
# `bootserv` group).
- import_tasks: install.yml
  when: bootserv_enabled | default(true) | bool

- import_tasks: uninstall.yml
  when: not (bootserv_enabled | default(true) | bool)
