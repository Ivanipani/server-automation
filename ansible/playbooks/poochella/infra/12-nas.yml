---
# Tier — Synology NAS (nas01) configuration.
#
# Sits between 10-router (which gives nas01 its DNS+DHCP reservation)
# and the rest of the fleet — must come before any tier that mounts a
# NAS share (the shared nfs-mounts role, applied from
# 14-host-base.yml and 30-guests/site.yml).
#
# This file is the deployment layer: it builds poochella-specific
# desired state — the storage.vol_path/storage.shares computed from
# inventory, plus the "NAS is a pure NFS server" design's service
# toggles — and hands it to the nas component (components/nas) as
# plain vars. The component itself never reads inventory — see
# docs/ansible-layout.md.
#
# Why a tier number that breaks the gap-10 convention (12-, not 20-):
# the NAS sits semantically between router and hypervisor in the
# dependency graph (router → nas → hypervisor). Renumbering the
# downstream tiers to make room for 20-nas would churn every other
# import. Pragmatism wins; documented here so the choice isn't
# mysterious.
#
# Field-name gaps observed on DSM 7.3.2 (2026-05-21):
#   - synology_dsm_nfs_enable_v4_1:
#       DSM 7.3 GET reports NFS minor version under `enabled_minor_ver`
#       (int: 0=off, 1=v4.1 on). The role's set field may be silently
#       ignored on 7.3 — re-verify with an ad-hoc GET after toggling.
#   - synology_dsm_smb_enable_transfer_log:
#       Not in DSM 7.3 GET response under that name (closest match is
#       `enable_enhance_log`). Likely renamed or write-only on 7.3.

- name: Build poochella-specific desired state for the nas component
  hosts: storage
  gather_facts: false
  connection: local
  tasks:
    # Everything the nas component's roles consume MUST be set via
    # set_fact (not plain `vars:`): a play's `vars:` is local to that
    # play, while set_fact persists as a host fact for the rest of this
    # ansible-playbook run — including the plays imported from
    # components/nas/site.yml below. See docs/ansible-layout.md.
    - name: "Compute storage desired state from inventory's storage: block"
      ansible.builtin.set_fact:
        synology_storage_vol_path: "{{ storage.vol_path }}"
        synology_storage_shares: "{{ storage.shares }}"
      when: storage is defined

- import_playbook: ../../../components/nas/site.yml
  vars:
    nas_hosts: storage
    synology_dsm_validate_certs: false   # DSM self-signed cert — see components/nas/roles/synology-dsm/README.md

    # --- Terminal (SSH / Telnet) ---------------------------------------------
    # SSH stays on as a break-glass for DSM admin work (DSM CLI tools,
    # log inspection) — we don't USE it for any data path (those ride
    # NFS), but turning sshd off would lock you out of the box without
    # a screen+keyboard. Leave it on; manage who can log in via DSM UI.
    synology_dsm_ssh_enable: true
    synology_dsm_ssh_port: 22
    synology_dsm_telnet_enable: false

    # --- File services: NFS --------------------------------------------------
    # NFS is the entire data plane in this design — every share's data
    # rides this protocol. v4 enabled because Longhorn's NFSv4 backup
    # target needs it. v4_1 left off (see the field-name caveat above).
    synology_dsm_nfs_enable: true
    synology_dsm_nfs_enable_v4: true
    synology_dsm_nfs_enable_v4_1: false

    # --- File services: SMB --------------------------------------------------
    synology_dsm_smb_enable: true
    synology_dsm_smb_workgroup: WORKGROUP
    synology_dsm_smb_disable_shadow_copy: false
    synology_dsm_smb_enable_transfer_log: false     # see header caveat

    # --- File services: rsync ------------------------------------------------
    # rsync is a prerequisite for the off-NAS Longhorn-backup replication
    # workflow (rsync-over-SSH from the cluster to a remote target — or
    # vice versa). DSM calls this "Network Backup Service" internally.
    # `enable_rsync_account` left OFF because the homelab uses rsync-over-
    # SSH (user@host:path style); flip it on if you ever need rsync://
    # protocol auth on port 873.
    synology_dsm_rsync_enable: true
    synology_dsm_rsync_enable_rsync_account: false
    synology_dsm_rsync_enable_custom_config: false
    synology_dsm_rsync_sshd_port: "22"

    # --- User Home Service ---------------------------------------------------
    # MANAGED — enabled so DSM creates /volume1/homes/<user> for every
    # DSM user. `pani` needs a real $HOME on /volume1 for
    # ~/.ssh/authorized_keys (consumed by the synology-ssh-access role +
    # every rsync-over-SSH workflow that uses pani@nas01.lan). The
    # role's users.yml does diff-before-write, so re-running this after
    # the desired state is reached reports `changed=0` and avoids DSM
    # 7.3's spurious 3327 error on idempotent /set calls.
    synology_dsm_manage_user_home_service: true
    synology_dsm_user_home_service_enable: true
    synology_dsm_user_home_location: /volume1
    synology_dsm_user_home_enable_recycle_bin: false

    # --- Package sources -----------------------------------------------------
    # Empty today. Add SynoCommunity / other feeds here as needed; the
    # role only adds missing entries, it never removes:
    #   - { name: "SynoCommunity", feed: "https://packages.synocommunity.com/" }
    synology_dsm_package_sources: []
