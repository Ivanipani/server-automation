---
# Tier R — router / network foundation (OPNsense).
#
# Must precede every other tier: dnsmasq reservations + DNS are how
# baremetal hosts become reachable by name and how each VM lands on its
# reserved IP the moment it DHCPs (see 30-guests). Self-contained —
# talks to the OPNsense API / SSHes the router only.
#
# This file is the deployment layer: it reads inventory topology
# (hostvars, group membership) to build the poochella-specific desired
# state, then hands it to the router component (components/router) as
# plain vars. The component itself never reads inventory — see
# docs/ansible-layout.md.

- name: Build poochella-specific desired state for the router component
  hosts: router
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Only used below to compute dnsmasq_pxe_tftp_servername /
    # dnsmasq_pxe_script_url within THIS play — not consumed by the
    # router component itself, so a plain play var is fine here.
    # `bootserv01` is a floating DNS identity (Unbound host-override
    # below), not an inventory host — it isn't tied to whichever
    # physical box currently runs the bootserv role.
    bootserv_fqdn: "bootserv01.lan"
  tasks:
    # Everything the router component's roles consume MUST be set via
    # set_fact (not plain `vars:`): a play's `vars:` block is local to
    # that play, while set_fact persists as a host fact for the rest of
    # this ansible-playbook run — including the plays imported from
    # components/router/site.yml below.

    # PXE flow: turn it on once some host has bootserv_enabled: true. The
    # dnsmasq role guards every PXE task with `dnsmasq_pxe_enabled`, so
    # this is the on/off switch for the whole chainload mechanism. The
    # TFTP server is advertised by RESOLVED IP (not hostname): bootserv's
    # host has a static reservation, but we still resolve bootserv_fqdn
    # via OPNsense's own DNS (rather than reading ip_address directly)
    # so old PXE ROMs that don't do DNS for option 66 (e.g. some
    # Mellanox FlexBoot revisions) still work, and a future bootserv
    # relocation only needs the Unbound override updated. script_url
    # stays as a hostname URL — iPXE itself does DNS resolution natively.
    - name: Compute PXE desired state
      ansible.builtin.set_fact:
        dnsmasq_pxe_enabled: >-
          {{ groups['all']
             | map('extract', hostvars)
             | selectattr('bootserv_enabled', 'defined')
             | selectattr('bootserv_enabled')
             | list | length > 0 }}
        # Resolved on the controller via `dig +short` against OPNsense
        # (DNS resolver on the LAN). `pipe` lookup avoids the dnspython
        # dependency that the community.general.dig lookup needs.
        dnsmasq_pxe_tftp_servername: >-
          {{ lookup('pipe', 'dig +short ' + bootserv_fqdn + ' @' + (hostvars['opnsense01'].ansible_host | default('10.1.1.1')))
             | trim | split('\n') | first }}
        dnsmasq_pxe_script_url: "http://{{ bootserv_fqdn }}:{{ bootserv_port }}/boot.ipxe"

    - name: Compute non-PXE dnsmasq/unbound desired state
      ansible.builtin.set_fact:
        # Auto-register DHCP-leased VMs/CTs as <hostname>.lan in DNS so
        # cloned nodes are reachable by name without static reservations.
        dnsmasq_register_dynamic_dns: true
        unbound_host_prefix: doghouse-

    # Build the static-lease list from inventory hostvars: every host
    # with `ip_address` plus either `mac_addresses` (physical, list) or
    # `mac_address` (VM, string) gets ONE reservation. OPNsense's
    # dnsmasq_host enforces unique IP per entry, so multi-NIC hosts
    # (e.g. metal-home-01's onboard + dual-port Mellanox) collapse to a
    # single entry with all MACs in `hardware_addr`. The two-field
    # split exists because VMs never have more than one NIC — see the
    # convention block at the top of inventory.yaml. `static_ip: true`
    # (router itself) opts out of any reservation.
    - name: Build static-lease list from inventory hostvars
      ansible.builtin.set_fact:
        dnsmasq_static_leases: >-
          {{
            (dnsmasq_static_leases | default([])) + [{
              'hostname': item,
              'address': hostvars[item].ip_address,
              'macs': hostvars[item].mac_addresses
                       if hostvars[item].mac_addresses is defined
                       else [hostvars[item].mac_address]
            }]
          }}
      loop: "{{ groups['all'] | sort }}"
      when:
        - (hostvars[item].mac_addresses is defined) or (hostvars[item].mac_address is defined)
        - hostvars[item].ip_address is defined
        - not (hostvars[item].static_ip | default(false))
      loop_control:
        label: "{{ item }}"

    # ── Seed desired Unbound host-overrides ────────────────────────
    # Built imperatively so the api.lan entry can be conditionally
    # appended below.
    - name: Seed desired Unbound host-overrides
      ansible.builtin.set_fact:
        unbound_host_overrides:
          # Wildcard *.doghouse.lan resolves to the MetalLB IP pinned
          # for the Traefik ingress (see k3s HelmChartConfig override),
          # so any Ingress host under doghouse.lan reaches the
          # cluster's ingress controller. Unbound treats hostname '*'
          # as a wildcard match for the domain.
          - description: doghouse-ingress-wildcard
            hostname: "*"
            domain: doghouse.lan
            record_type: A
            value: 10.1.1.250

          # PostgreSQL (pg-alpha) primary, exposed outside the cluster on a
          # pinned MetalLB IP for pgAdmin & co. (see k8s pg-alpha.yaml
          # managed.services). Lives in the top-level `lan` zone, NOT
          # doghouse.lan: it's a peer of the ingress with its own
          # LoadBalancer IP, and the *.doghouse.lan wildcard makes that zone
          # redirect — which forbids per-host local-data below the apex (same
          # reasoning as the apiserver below). The value must stay in sync
          # with the MetalLB annotation on the pg-alpha-lb Service.
          - description: doghouse-pg-alpha
            hostname: pg-alpha
            domain: lan
            record_type: A
            value: 10.1.1.240

    # bootserv01.lan is a floating identity, not an inventory host —
    # point it at whichever host currently has bootserv_enabled: true
    # (today: metal-home-02) so every hardcoded bootserv01.lan reference
    # in roles/bootserv/templates/*.j2 keeps resolving across a future
    # relocation without further template edits.
    - name: Append bootserv01.lan -> bootserv host to desired state
      ansible.builtin.set_fact:
        unbound_host_overrides: "{{ unbound_host_overrides + [{
          'description': 'bootserv01',
          'hostname': 'bootserv01',
          'domain': domain | default('lan'),
          'record_type': 'A',
          'value': hostvars[_bootserv_host].ip_address,
        }] }}"
      vars:
        _bootserv_host: >-
          {{ groups['all']
             | map('extract', hostvars)
             | selectattr('bootserv_enabled', 'defined')
             | selectattr('bootserv_enabled')
             | map(attribute='inventory_hostname')
             | first }}
      when: dnsmasq_pxe_enabled | bool

    # Stable name in front of the k3s apiserver (kube-vip L2 VIP).
    # Lives in the top-level `lan` zone (transparent), NOT under
    # doghouse.lan: the *.doghouse.lan wildcard above makes that zone
    # `redirect`, and Unbound forbids per-host local-data anywhere but
    # the zone apex in a redirect zone ("local-data in redirect zone
    # must reside at top of zone"). Putting the apiserver in .lan also
    # keeps the topology honest — the apiserver is a peer of the
    # ingress, not a service behind it.
    #
    # Hostname + domain are split out of k3s_api_dns_name so this stays
    # inventory-driven: change the name (and the VIP) in
    # group_vars/kubernetes.yml only, and both Unbound and the k3s role
    # follow.
    #
    # We bounce through ANY `kubernetes` member's hostvars (not just a
    # control plane) because `k3s_api_dns_name` and
    # `k3s_kube_vip_address` are group_vars/kubernetes.yml — every kube
    # member (CP, VM worker, baremetal worker) inherits the same
    # cluster-wide value. `kube_control_plane` is empty today
    # (worker-home-02 is currently the only kube node), and indexing an
    # empty list trips Ansible's lazy-templating error. The `when:`
    # gate makes the task skip cleanly when the `kubernetes` group has
    # no members at all — and orphan-cleanup will then drop any
    # previously-applied api.lan entry.
    - name: Append api.lan -> k3s apiserver VIP to desired state
      ansible.builtin.set_fact:
        unbound_host_overrides: "{{ unbound_host_overrides + [{
          'description': 'doghouse-apiserver',
          'hostname': hostvars[groups['kubernetes'][0]].k3s_api_dns_name.split('.', 1)[0],
          'domain':   hostvars[groups['kubernetes'][0]].k3s_api_dns_name.split('.', 1)[1],
          'record_type': 'A',
          'value':    hostvars[groups['kubernetes'][0]].k3s_kube_vip_address,
        }] }}"
      when: groups['kubernetes'] | length > 0

- import_playbook: ../../../components/router/site.yml
  vars:
    router_hosts: router
