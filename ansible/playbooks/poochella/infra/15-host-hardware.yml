---
# Layer-2 component: host-hardware (disks, NFS mounts, NIC-offload
# workaround, firmware baseline) on every baremetal Linux host
# (`physical` = hypervisors + workers).
#
# This file is the deployment layer: it computes the inventory-derived
# facts the component's roles need (a role never reads group
# membership or another host's hostvars — see docs/ansible-layout.md)
# and hands them to the host-hardware component as plain vars, then
# imports the component.
#
# host_disks_action / host_disks_register_pve: re-emitted via set_fact
# (not just accepted as a play var) so a caller overriding them via
# `import_playbook: 15-host-hardware.yml / vars:` (13-foundation does,
# for its read-only reconcile pass) — or `-e` on the CLI — reaches the
# host-disks role two import_playbook hops down. A plain `vars:` only
# reliably reaches plays in THIS file; set_fact persists as a host fact
# for the rest of the run, including the nested component import below.

- name: Compute host-hardware desired state from inventory
  hosts: "{{ target_hosts | default('physical') }}"
  gather_facts: false
  connection: local
  tasks:
    - name: Compute whether this host is a PVE hypervisor
      ansible.builtin.set_fact:
        host_disks_is_hypervisor: "{{ inventory_hostname in groups.get('hypervisors', []) }}"

    - name: Resolve nas01's address for NFS mounts
      ansible.builtin.set_fact:
        nfs_mounts_server: "{{ hostvars['nas01'].ansible_host }}"
      when: "'nas01' in hostvars"

    - name: Re-emit host_disks_action / host_disks_register_pve as host facts
      ansible.builtin.set_fact:
        host_disks_action: "{{ host_disks_action | default('info') }}"
        host_disks_register_pve: "{{ host_disks_register_pve | default(false) }}"

- import_playbook: ../../../components/host-hardware/site.yml
  vars:
    host_hardware_hosts: "{{ target_hosts | default('physical') }}"
