---
# Tier 17 — put the primary NIC of the KubeVirt VM hosts behind a Linux bridge.
#
# WHY: a KubeVirt VM that is to be an Ansible target like any other fleet host
# needs a real LAN NIC — its own MAC, its own OPNsense dnsmasq reservation,
# reachable from the control node. In k8s terms that is a Multus secondary
# network, and of the CNIs that can provide one, only the bridge CNI works with
# KubeVirt's bridge binding: the binding MOVES the pod interface's MAC onto the
# VM, which is precisely what macvlan/ipvlan cannot tolerate (upstream lists
# them as unsupported for this reason). The bridge CNI needs a host bridge to
# drop its veth into; this play creates it.
#
# Runs AFTER 30-firewall.yml on purpose: the role adds a `ufw route` rule for
# bridged guest traffic, and 30-firewall.yml enabling/reconciling ufw first
# means that rule lands on a settled firewall instead of racing it.
#
# NOT idempotency-cheap to get wrong: the role rewrites the interfaces(5) file
# of a host whose ONLY cabled NIC is the one being enslaved, then cuts it over
# live. It does that behind a dead-man's switch (see roles/net-bridge/defaults)
# and is a strict no-op once converged. Hosts without a `network_bridge:` block
# in inventory are skipped.
#
# Reverse with `-e net_bridge_enabled=false` (restores the saved pre-bridge
# config through the same cutover machinery).

- name: Bridge the primary NIC on hosts that declare one
  hosts: "{{ target_hosts | default('physical') }}"
  become: true
  roles:
    - role: net-bridge
      when: (network_bridge | default({})) | length > 0
