---
# poochella infra — ordered tiers, each a directory with its own
# ordered site.yml. The directory IS the target tier, so "what runs
# where" and "what order" stop fighting; ordinals are gap-10 within a
# tier so steps insert without renumbering.
#
#   control-node   → layer-0 component (components/control-node):
#                    control-node prerequisites — vaulted ansible
#                    keypair, inventory symlink, tool deps.
#   10-router      → layer-3 component (components/router), invoked via
#                    the deployment wrapper 10-router.yml (builds
#                    poochella-specific desired state — static leases,
#                    Unbound records — from inventory, then imports the
#                    component). OPNsense DNS/DHCP/PXE/tailnet
#                    foundation; precedes everything else. See
#                    docs/ansible-layout.md.
#   12-nas         → layer-3 component (components/nas), invoked via
#                    the deployment wrapper 12-nas.yml (builds the
#                    storage.vol_path/storage.shares desired state from
#                    inventory, then imports the component). Synology
#                    NAS — gap-5 break from the gap-10 convention,
#                    independent of host bootstrap; admin'd via DSM,
#                    not the ansible user/key path the host-base
#                    component sets up. See docs/ansible-layout.md.
#   14-host-base   → Layer-1 component (components/host-base), invoked
#                    via the deployment wrapper 14-host-base.yml: every
#                    baseline condition a baremetal Linux host needs —
#                    ansible/pani/tourmanager users, SSH hardening,
#                    firewall, MOTD, node-local disks, NFS mounts,
#                    NIC-offload workaround, firmware baseline,
#                    Tailscale, node_exporter — on every host in
#                    `physical` (today: workers only, see below).
#   15-bootserv    → bootserv role on the `bootserv` group (today:
#                    metal-home-02 — see inventory.yaml). No longer
#                    Proxmox-coupled: runs on an already-provisioned
#                    baremetal worker, so it just needs 14-host-base's
#                    baseline (ansible user, firewall) ahead of it.
#   40-kube        → layer-4 kube component via 40-kube.yml:
#                    Longhorn consumers, k3s, and Flux bootstrap
#
# ARCHIVED: 13-foundation, 20-hypervisor, and 30-guests — the Proxmox
# hypervisor bootstrap tiers and the OpenTofu VM/LXC provisioning barrier
# — are not part of this tier list. The fleet has 0 Proxmox hypervisors
# today (every former PVE box was converted to baremetal), so that
# machinery was moved out of the hot path to
# archive/proxmox-hypervisor/ (see its README.md) rather than deleted.
# To bring a hypervisor back: move
# archive/proxmox-hypervisor/{tofu,ansible/roles/hypervisor,ansible/playbooks/{13-foundation,20-hypervisor,30-guests}}
# back to their original paths and re-add
# `- import_playbook: 13-foundation/site.yml` (before 14-host-base),
# `- import_playbook: 20-hypervisor/site.yml`, and
# `- import_playbook: 30-guests/site.yml` (both after 15-bootserv) below.
#
# Single-host piecemeal dev: fzf-pick any one tier playbook via
# `just run --limit <host>`. Each playbook self-bootstraps (via the
# ssh-bootstrap-detect role) and asserts its own pre-conditions, so
# this ordering is the happy path, not the only one.
- import_playbook: ../../../components/control-node/site.yml
- import_playbook: 10-router.yml
- import_playbook: 12-nas.yml
- import_playbook: 14-host-base.yml
- import_playbook: 15-bootserv.yml
- import_playbook: 40-kube.yml
