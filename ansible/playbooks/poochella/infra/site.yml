---
# poochella infra — ordered tiers, each a directory with its own
# ordered site.yml. The directory IS the target tier, so "what runs
# where" and "what order" stop fighting; ordinals are gap-10 within a
# tier so steps insert without renumbering.
#
#   control-node   → layer-0 component (components/control-node):
#                    control-node prerequisites — vaulted ansible
#                    keypair, inventory symlink, tool deps.
#   10-router      → layer-3 component (components/router), invoked via
#                    the deployment wrapper 10-router.yml (builds
#                    poochella-specific desired state — static leases,
#                    Unbound records — from inventory, then imports the
#                    component). OPNsense DNS/DHCP/PXE/tailnet
#                    foundation; precedes everything else. See
#                    docs/ansible-layout.md.
#   12-nas         → layer-3 component (components/nas), invoked via
#                    the deployment wrapper 12-nas.yml (builds the
#                    storage.vol_path/storage.shares desired state from
#                    inventory, then imports the component). Synology
#                    NAS — gap-5 break from the gap-10 convention,
#                    independent of host bootstrap; admin'd via DSM,
#                    not the ansible user/key path the os-baseline
#                    component sets up. See docs/ansible-layout.md.
#   13-foundation  → Foundational subset (the `foundation` group, today
#                    just pve-home-01): full os-baseline + host-hardware
#                    + 20-hypervisor stack PLUS a bootstrap-only LXC
#                    template bake PLUS a TARGETED Tofu apply that
#                    creates ONLY the infra LXCs (bootserv01) PLUS the
#                    bootserv role PLUS the full PRODUCER step that
#                    bakes the Debian VM qcow2 and snapshots the LXC
#                    template, publishing both to bootserv01 HTTP. Must
#                    complete before 14-os-baseline below — fresh
#                    baremetals need bootserv01.lan to netboot AND
#                    fresh hypervisors need the published artifacts to
#                    consume. The tier re-imports the os-baseline /
#                    host-hardware / 20-hypervisor deployment wrappers
#                    with `target_hosts: foundation` rather than
#                    duplicating them.
#   14-os-baseline → Layer-1 component (components/os-baseline), invoked
#                    via the deployment wrapper 14-os-baseline.yml:
#                    ansible/pani/tourmanager users, SSH hardening,
#                    firewall, MOTD on every baremetal Linux host
#                    (`physical` = hypervisors + workers). Re-applied
#                    here against the wider `physical` group —
#                    pve-home-01 sees a no-op second pass (13-foundation
#                    already did it).
#   15-host-hardware → Layer-2 component (components/host-hardware),
#                    invoked via the deployment wrapper
#                    15-host-hardware.yml: node-local disks, NFS mounts,
#                    NIC-offload workaround, firmware baseline. Same
#                    re-apply-is-a-no-op relationship to 13-foundation
#                    as 14-os-baseline above.
#   16-remote-access → Layer-2 component (components/remote-access):
#                    Tailscale (default-off in poochella).
#   17-observability → Layer-2 component (components/observability):
#                    Prometheus node_exporter.
#   20-hypervisor  → Proxmox-only fabric (repo flip, cluster, LVM-thin
#                    register, template consume from bootserv01).
#                    Depends on 14-os-baseline having created the
#                    ansible user and on 13-foundation having published
#                    the centrally-baked VM/LXC artifacts to bootserv01.
#                    Also re-applied against the wider `hypervisors`
#                    group; no-op on foundation hypervisors.
#   30-guests      → OpenTofu barrier (router + hypervisor converge)
#                    Runs the UN-TARGETED `tofu apply` — creates VMs
#                    and reconciles the infra LXCs already created by
#                    13-foundation.
#   40-kube        → VM/container config + k3s
#
# Single-host piecemeal dev: fzf-pick any one tier playbook via
# `just run --limit <host>`. Each playbook self-bootstraps (via the
# ssh-bootstrap-detect role) and asserts its own pre-conditions, so
# this ordering is the happy path, not the only one.
- import_playbook: ../../../components/control-node/site.yml
- import_playbook: 10-router.yml
- import_playbook: 12-nas.yml
- import_playbook: 13-foundation/site.yml
- import_playbook: 14-os-baseline.yml
- import_playbook: 15-host-hardware.yml
- import_playbook: 16-remote-access.yml
- import_playbook: 17-observability.yml
- import_playbook: 20-hypervisor/site.yml
- import_playbook: 30-guests/site.yml
- import_playbook: 40-kube/site.yml
