---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/networking/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: networking-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/networking/configs
  prune: true
  wait: true
  dependsOn:
    - name: networking-controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/storage/controllers
  prune: true
  # The Longhorn HelmRelease uses disableWait (DaemonSet-heavy chart on a
  # blip-prone substrate), so HelmRelease readiness is "manifests applied" —
  # actual pod health is observed via Prometheus/Alertmanager. The HelmRelease
  # becoming Ready also gates storage-configs below: Helm installs the
  # longhorn.io CRDs during install (crds: CreateReplace), then marks the
  # release Ready, then Flux unblocks storage-configs and its BackupTarget /
  # RecurringJob CRs can dry-run successfully.
  wait: true
  dependsOn:
    - name: networking-configs
  decryption:
    # The longhorn UI basic-auth Secret is SOPS-encrypted.
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/storage/configs
  prune: true
  wait: true
  dependsOn:
    - name: storage-controllers
  decryption:
    # longhorn-gcs-s3 (HMAC creds for the gcs BackupTarget) is SOPS-encrypted.
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/database/controllers
  prune: true
  wait: true
  dependsOn:
    - name: networking-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/database/configs
  prune: true
  wait: true
  dependsOn:
    - name: database-controllers
  decryption:
    # The pg-alpha owner credentials (pg-alpha-app.sops.yaml) are SOPS-encrypted.
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: messaging-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/messaging/controllers
  prune: true
  wait: true
  dependsOn:
    - name: networking-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: virtualization-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # The vendored operator manifest is ~470KB, nearly all of it the kubevirts.io
  # CRD; server-side apply of it plus a 2-replica Deployment rollout on the
  # (software-emulated) control plane wants more than the usual 5m.
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/virtualization/controllers
  prune: true
  # Gates virtualization-configs below: virt-operator Ready means the
  # kubevirts.kubevirt.io CRD is established, so the KubeVirt CR can dry-run.
  wait: true
  dependsOn:
    - name: networking-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: virtualization-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  # virt-operator rolls out virt-api + virt-controller + virt-handler and waits
  # on cert generation before the KubeVirt CR reports Available.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/virtualization/configs
  prune: true
  wait: true
  dependsOn:
    - name: virtualization-controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # The VMs themselves, one directory per guest. Separate from
  # virtualization-configs on purpose: a wedged VM must not stall the
  # KubeVirt/CDI CRs that every other VM depends on.
  name: virtual-machines
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/virtualization/vms
  prune: true
  # wait:false — a VM's first boot begins with CDI importing a ~650MB qcow2
  # into a fresh Longhorn volume. That is minutes of legitimate not-Ready, and
  # blocking a Flux Kustomization on it buys nothing: nothing else in the tree
  # depends on a VM being up.
  wait: false
  dependsOn:
    # KubeVirt + CDI must be Available before a VirtualMachine / DataVolume can
    # even dry-run against the API.
    - name: virtualization-configs
    # The root disk is a Longhorn PVC.
    - name: storage-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/monitoring/controllers
  prune: true
  wait: true
  dependsOn:
    - name: networking-configs
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/monitoring/configs
  prune: true
  wait: true
  dependsOn:
    - name: monitoring-controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/cicd/controllers
  prune: true
  wait: true
  dependsOn:
    - name: networking-configs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/cicd/controllers/cloudflared
  prune: true
  wait: true
  dependsOn:
    - name: networking-configs
  # The tunnel token is SOPS-encrypted; decrypt with the cluster sops-age key
  # (the cicd-controllers Kustomization has no decryption, hence its own
  # Kustomization here). Reconciled standalone — cloudflared/ is not listed in
  # the cicd/controllers kustomization, so cicd-controllers never sees it.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cicd-configs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/cicd/configs
  prune: true
  wait: true
  dependsOn:
    - name: cicd-controllers
  # The cloudevents sink's GitHub PAT (github-status.sops.yaml) is SOPS-encrypted;
  # decrypt with the cluster sops-age key (installed in flux-system by Ansible).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
