---
# Multus CNI (thin plugin), vendored from the upstream release (NOT a remote
# base — kustomize-controller would refetch it from github on every reconcile).
#
#   VERSION PIN: v4.2.4
#   Upgrade =  curl -sL https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/<ver>/deployments/multus-daemonset.yml \
#                -o multus-daemonset.yaml
#              and bump BOTH the pin in this comment and the `images:` newTag
#              below. Upstream ships the file with the `snapshot` tag baked in,
#              so the tag pin CANNOT come from the vendored file.
#
# WHY MULTUS IS HERE AT ALL: KubeVirt VMs that must behave like every other
# fleet host need a real LAN NIC — their own MAC, their own OPNsense dnsmasq
# reservation, reachable from the Ansible control node. That is a SECONDARY
# network attachment, and Multus is the only way k8s does secondary networks.
# The attachment itself (a macvlan NetworkAttachmentDefinition) lives with the
# VM that consumes it, in k8s/infra/virtualization/vms/.
#
# The upstream file is applied unmodified; the k3s-specific host paths and the
# node scoping are layered on via the patch below.
#
# REMOVAL IS NOT JUST A PRUNE: Multus installs itself INTO the node (the multus
# binary in the CNI bin dir, and 00-multus.conf, which containerd then prefers
# over 10-flannel.conflist because it sorts first). Deleting the DaemonSet
# leaves that conf behind pointing at a binary nothing maintains. To back this
# out, delete 00-multus.conf from
# /var/lib/rancher/k3s/agent/etc/cni/net.d on each VM host as well.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - multus-daemonset.yaml
images:
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.2.4
patches:
  - path: k3s-placement.yaml
    target:
      kind: DaemonSet
      name: kube-multus-ds
