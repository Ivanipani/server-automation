---
# Two changes upstream's quickstart DaemonSet cannot know about.
#
# 1. K3S HOST PATHS. Upstream assumes kubeadm's /etc/cni/net.d + /opt/cni/bin.
#    k3s uses neither — its containerd is configured (agent/etc/containerd/
#    config.toml) with:
#      conf_dir = /var/lib/rancher/k3s/agent/etc/cni/net.d
#      bin_dir  = /var/lib/rancher/k3s/data/cni
#    /opt/cni/bin does not even exist on these nodes, so without this patch
#    Multus would install its binary and write 00-multus.conf where nothing
#    reads them, and pods would keep using plain flannel — a silent no-op.
#    `data/cni` is the STABLE bin dir (a directory of symlinks into the
#    version-hashed data/<sha>/bin), so it survives k3s upgrades; the macvlan
#    binary the NetworkAttachmentDefinition needs is dropped in there by
#    Ansible (roles/cni-plugins), since k3s bundles no macvlan.
#
#    Container-side mount paths (/host/etc/cni/net.d, /host/opt/cni/bin) are
#    deliberately UNCHANGED — thin_entrypoint's --cni-conf-dir args point at
#    them, so only the hostPath source moves.
#
# 2. NODE SCOPE. Multus runs ONLY on the KubeVirt VM hosts. Multus in
#    auto-config mode inserts itself as the node's default CNI (00-multus.conf
#    delegating to flannel) — a real, if standard, change to pod networking on
#    every node it lands on. Nothing outside the VM hosts needs secondary
#    networks, and only the VM hosts have the br0 uplink the attachments point
#    at, so the blast radius is kept to the two baremetal workers.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  template:
    spec:
      nodeSelector:
        # Stamped by the k3s role from group_vars/kube_workers.yml.
        poochella.club/virt-host: "true"
      volumes:
        - name: cni
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
        - name: cnibin
          hostPath:
            path: /var/lib/rancher/k3s/data/cni
