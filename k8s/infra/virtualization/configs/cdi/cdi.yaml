---
# The CDI CR — cdi-operator reads it and rolls out every other component
# (cdi-apiserver, cdi-deployment, cdi-uploadproxy). Version comes from
# cdi-operator (see ../../controllers/cdi/), never here.
#
# Vendored from the release's cdi-cr.yaml with placement added; everything
# else is upstream's default.
#
# SPLIT PLACEMENT, same shape as the KubeVirt CR next door but with BOTH tiers
# on the baremetal workers:
#
#   spec.infra    → the CDI control components. Upstream would spread them
#                   anywhere; here they must stay off the control-plane VMs,
#                   whose TCG `-cpu qemu64` emulation SIGILLs x86-64-v2 Go
#                   binaries (see ../../controllers/cdi/operator-placement.yaml).
#   spec.workload → importer / uploadserver / cloner pods. These stream a disk
#                   image into a Longhorn PVC, and Longhorn's disks live only
#                   on these two nodes, so the data path is node-local.
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      - HonorWaitForFirstConsumer
  imagePullPolicy: IfNotPresent
  infra:
    nodeSelector:
      kubernetes.io/os: linux
      # Stamped by the k3s role from group_vars/kube_workers.yml.
      poochella.club/virt-host: "true"
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
  workload:
    nodeSelector:
      kubernetes.io/os: linux
      poochella.club/virt-host: "true"
