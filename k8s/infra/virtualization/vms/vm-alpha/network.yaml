---
# The VM's LAN NIC.
#
# WHY BRIDGE AND NOT MACVLAN: KubeVirt's bridge binding MOVES the pod
# interface's MAC address onto the VM and leaves the pod side with a different
# one. macvlan and ipvlan require the pod interface to keep its original MAC,
# so upstream lists both as unsupported for bridge interfaces — with macvlan
# the VM gets a link and silently receives nothing. The bridge CNI has no such
# constraint: it drops a veth into a host bridge, the VM's MAC is learned on
# that bridge, and the frame reaches the LAN unmodified.
#
# br0 is created on each VM host by Ansible (roles/net-bridge, driven by
# `network_bridge:` in inventory.yaml) with the node's primary NIC as its only
# port. `ipam: {}` is deliberate: the pod side gets NO address — the guest
# DHCPs for itself and OPNsense answers from the reservation keyed on the MAC
# pinned in virtualmachine.yaml. That is what makes the VM a real LAN host
# rather than something living behind a pod-network translation.
#
# The bridge CNI plugin ships with k3s (data/cni/bridge), so nothing extra is
# installed on the node for this; Multus is what allows a SECOND interface to
# be attached at all.
#
# ORDERING CAUTION: run 17-host/35-network-bridge.yml BEFORE a VM first lands
# on a node. The bridge CNI CREATES a bridge of this name when it finds none —
# an empty one, with no physical port — and the VM then boots onto an isolated
# L2 segment: link up, DHCP unanswered, no error anywhere. A missing br0 fails
# quietly, not loudly.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-br0
  namespace: virtual-machines
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "lan-br0",
      "type": "bridge",
      "bridge": "br0",
      "ipam": {}
    }
