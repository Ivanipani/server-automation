---
# vm-alpha — the first KubeVirt guest, and a full member of the fleet: it holds
# a dnsmasq reservation, answers on vm-alpha.lan, and takes Ansible role
# deploys exactly like a Proxmox VM does.
#
# LOCKSTEP CONTRACT with ansible/inventory.yaml (`kubevirt_guests.vm-alpha`):
# the MAC below and the reservation there are the same identity. Change one,
# change both — Flux cannot read the inventory, so nothing enforces this but
# this comment.
#
# THE ROOT DISK IS THE FLEET'S OWN BAKED IMAGE, not an upstream cloud image.
# 13-foundation/95-bake-publish-images.yml virt-customizes Debian 13 with the
# canonical baseline (the `ansible` user + fleet SSH key, tourmanager
# break-glass, sshd hardening, locked root, no unattended-upgrades) and
# publishes it to bootserv01. Cloning THAT is what makes this VM an Ansible
# target the moment it boots: no key provisioning, no cloud-init user
# scaffolding, and byte-identical baseline to every other guest, so a 17-host
# style run against it is changed=0.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm-alpha
  namespace: virtual-machines
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: vm-alpha-root
      spec:
        source:
          http:
            # Same artifact the Proxmox VM templates are cloned from — served
            # off the LAN by bootserv01, so the import never leaves the house.
            # Re-pinning the image (vars/templates.yml) means bumping this URL
            # too; a DataVolume is immutable once imported, so an existing VM
            # keeps the disk it was built from until deliberately recreated.
            url: http://bootserv01.lan/cloud-images/debian-13-genericcloud-amd64-20260518-2482.qcow2
        storage:
          accessModes:
            - ReadWriteOnce
          # Block, not Filesystem: KubeVirt hands the raw device straight to
          # QEMU, skipping the host filesystem layer under the guest's own.
          # RWO + no live migration (single VM-capable node) makes this safe.
          volumeMode: Block
          # Explicit — the cluster has TWO default StorageClasses (local-path
          # and longhorn), so an omitted class is a coin flip, and local-path
          # would pin the VM's disk to one node's OS drive with no replica.
          storageClassName: longhorn
          resources:
            requests:
              # The qcow2 is ~3 GiB virtual; cloud-init's growpart expands the
              # root filesystem to fill this on first boot.
              storage: 50Gi
  template:
    metadata:
      labels:
        kubevirt.io/domain: vm-alpha
    spec:
      # Only the baremetal workers have real hardware virt (and the br0 uplink
      # this VM's NIC needs). Belt and braces: virt-handler advertises
      # devices.kubevirt.io/kvm only where KVM actually works, so the scheduler
      # would refuse the emulated control-plane VMs regardless.
      nodeSelector:
        poochella.club/virt-host: "true"
      # One VM-capable node today (metal-home-01 has SVM off in UEFI), so there
      # is nowhere to migrate to — drain must not try, and must not block.
      evictionStrategy: None
      terminationGracePeriodSeconds: 180
      domain:
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: lan
              # Bridge binding: the VM sits behind the veth the bridge CNI
              # puts into br0, with its own MAC on the LAN. See network.yaml.
              bridge: {}
              macAddress: "02:00:00:00:03:01"
          # Entropy for the guest — a fresh VM generating SSH host keys before
          # the entropy pool fills is the classic first-boot stall.
          rng: {}
        machine:
          type: q35
      networks:
        - name: lan
          multus:
            # NetworkAttachmentDefinition in this namespace. NOTE: no pod
            # network is attached at all — this VM has exactly one NIC, on the
            # LAN, like any other fleet host. It reaches cluster services the
            # same way the laptop does, not through kube-dns.
            networkName: lan-br0
      volumes:
        - name: root
          dataVolume:
            name: vm-alpha-root
        - name: cloudinit
          cloudInitNoCloud:
            # Users/keys/hardening are already IN the image; cloud-init only
            # has to set identity here. `manage_etc_hosts` keeps sudo from
            # stalling on an unresolvable hostname.
            userData: |
              #cloud-config
              hostname: vm-alpha
              fqdn: vm-alpha.lan
              prefer_fqdn_over_hostname: false
              manage_etc_hosts: true
            # Match on MAC, never on interface name: the guest's NIC name is a
            # function of PCI topology and would silently change if the device
            # layout ever moved. DHCP is answered by OPNsense from the
            # reservation keyed on this same MAC, which is what pins
            # 10.1.1.115 / vm-alpha.lan.
            networkData: |
              version: 2
              ethernets:
                lan:
                  match:
                    macaddress: "02:00:00:00:03:01"
                  dhcp4: true
