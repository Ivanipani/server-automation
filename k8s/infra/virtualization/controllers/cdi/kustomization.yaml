---
# CDI (Containerized Data Importer) operator, vendored from the upstream
# release (NOT a remote base — kustomize-controller would refetch it from
# github on every reconcile).
#
#   VERSION PIN: v1.62.0
#   Upgrade =  curl -sL https://github.com/kubevirt/containerized-data-importer/releases/download/<ver>/cdi-operator.yaml \
#                -o cdi-operator.yaml
#              plus the matching cdi-cr.yaml under ../../configs/cdi/, and bump
#              the pin in this comment. Like virt-operator, cdi-operator
#              reconciles every other CDI component to the version baked into
#              its own Deployment env (CONTROLLER_IMAGE / IMPORTER_IMAGE / …),
#              so this file is the single version source — the CDI CR carries
#              no version.
#
#   WHY 1.62 AND NOT 1.66: same k8s-support-window rule that pins KubeVirt to
#   the 1.6 branch. v1.62.0's release notes are the last to read "Bump CI to
#   test 1.31" / "k8s 1.31 dependencies"; v1.65+ moved their kubevirtci lanes
#   to 1.35/1.36. This cluster is k3s v1.31.4. Moving off 1.62 requires
#   upgrading k3s FIRST — in lockstep with the KubeVirt bump.
#
# WHY CDI IS HERE AT ALL: KubeVirt alone can only boot a container-image root
# disk (ephemeral — every reboot discards the guest's filesystem). A VM that
# receives Ansible role deploys needs a PERSISTENT root, i.e. a PVC populated
# from a disk image. Importing an image into a PVC is exactly what CDI's
# DataVolume does; nothing else in the stack can.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cdi-operator.yaml
patches:
  - path: operator-placement.yaml
    target:
      kind: Deployment
      name: cdi-operator
