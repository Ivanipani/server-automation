---
# Pin cdi-operator to the baremetal VM hosts.
#
# This DIVERGES from virt-operator (which sits on the control plane) on
# purpose: the workers are where CDI's work actually happens. Importer pods
# stream a disk image into a Longhorn PVC, and Longhorn's disks exist only on
# these two nodes, so keeping the whole of CDI here makes the data path
# node-local instead of pulling hundreds of megabytes across the control
# plane's shared 1GbE.
#
# Secondary reason, historical: control-plane VMs cloned before the CPU model
# was switched to host-passthrough ran `-cpu qemu64` (x86-64-v1) under TCG,
# where modern Go release binaries die instantly on SIGILL — exit 132, no log
# output, which is how virt-operator first crashlooped. Any operator landing on
# a control plane depends on those VMs having been rebuilt.
#
# cdi-operator predates the CDI CR (it is what installs it), so its placement
# CANNOT come from the CR's spec.infra.nodePlacement — it has to be patched
# onto the Deployment here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdi-operator
  namespace: cdi
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        # Stamped by the k3s role from group_vars/kube_workers.yml.
        poochella.club/virt-host: "true"
